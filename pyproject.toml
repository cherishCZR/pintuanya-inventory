[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pintuanya-inventory"
version = "0.1.0a1"
description = "Evidence-first participant inventory diagnostics; offline-first"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12"
]
dependencies = []

[project.optional-dependencies]
ui = ["streamlit==1.67.0", "tzdata==2026.6"]
test = ["pytest==9.2.0"]
capture = ["mitmproxy==12.3.1", "Brotli==1.2.1"]

[project.scripts]
pintuanya-inventory = "pintuanya_inventory.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.cache/pytest"
